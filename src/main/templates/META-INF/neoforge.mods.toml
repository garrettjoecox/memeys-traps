# Mod metadata. Placeholders are filled in from gradle.properties by the generateModMetadata task.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="memeythemoose"
description='''
Bear traps, wind traps, landmines, motion detectors, alarms, instant TNT and booby-trapped furniture.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
